[project]
name = "agent-forge"
version = "0.1.0"
description = "工业级 AI Agent 系统：多 Agent 任务执行引擎 + 半导体良率根因分析（Yield RCA）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "referencing>=0.37.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tavily>=1.1.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 行宽取项目编码规范的上限（docs/engineering/编码规范文档.txt：「行长度不超过 120 字符」），
# 不是 Ruff 默认的 88；改回默认会让既有 120 字符以内的生产代码全部变成 E501。
line-length = 120

[tool.ruff.lint]
# E501 属于 E5，不在本版本 Ruff 的默认规则集内：0.16.8 实测默认启用 I001、F401、F841、
# PLR1711、UP、SIM、RET、C4、A、TRY、RUF 等大量规则，唯独不含 E501。因此不扩展选择，
# 上面的 line-length 不会生效。
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 声明式数据表：一行一条记录（批次良率样例），拆行反而降低可读性。
# 依据 docs/engineering/ai-engineering-rules.md#indicators「生成代码和声明式数据按性质
# 判断，不机械套用行数」。该文件只含字面量，行宽不构成维护成本。
"app/integration/tools/builtin/rca/data.py" = ["E501"]

[tool.ruff.format]
# 排除声明式数据表：一行一条记录，格式化会拆成每条 6 行（32 行 → 139 行）。
# 排除 Markdown：`ruff format` 会重排文档里的 ```python 代码块，破坏示例中刻意对齐的
# 注释列，并改写 adr/、issues/ 下的历史记录——记录规范要求保留原状。
exclude = [
    "app/integration/tools/builtin/rca/data.py",
    "**/*.md",
]
